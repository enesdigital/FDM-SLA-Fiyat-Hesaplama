worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { default_type text/plain; return 200 'ok\n'; }
    location = /deployment.json { add_header Cache-Control 'no-store'; try_files $uri =404; }
    location ^~ /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
    location ~* \.(js|css|wasm|ttf|woff2|png|svg|webmanifest)$ { add_header Cache-Control 'no-cache'; try_files $uri =404; }
    location / { add_header Cache-Control 'no-cache'; try_files $uri $uri/ /index.html; }
  }
}
